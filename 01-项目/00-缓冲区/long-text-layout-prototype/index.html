<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>行间 - 长文本排版</title>
  <style>
    :root {
      --bg: #f2f3f5;
      --surface: #ffffff;
      --surface-raised: #f8f8fa;
      --surface-muted: #eceef1;
      --text: #1d1d1f;
      --muted: #666a73;
      --faint: #858994;
      --line: #d8dbe1;
      --line-strong: #b9bec8;
      --primary: #087a68;
      --primary-hover: #056858;
      --primary-soft: #e5f3ef;
      --accent: #b54f35;
      --danger: #b3261e;
      --shadow: 0 18px 50px rgba(24, 29, 38, 0.08);
      --radius: 8px;
      --preview-size: 18px;
      --reading-width: 720px;
      --ui-font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
      --reading-font: "Iowan Old Style", "Songti SC", "STSong", "Noto Serif SC", serif;
    }

    body[data-theme="dark"] {
      --bg: #111315;
      --surface: #1a1d20;
      --surface-raised: #202429;
      --surface-muted: #292e34;
      --text: #f5f5f7;
      --muted: #b5bac3;
      --faint: #8e949e;
      --line: #363c43;
      --line-strong: #505862;
      --primary: #3cc6ac;
      --primary-hover: #62d5bf;
      --primary-soft: #173c35;
      --accent: #ff9072;
      --danger: #ff8a80;
      --shadow: 0 22px 56px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui-font);
      font-size: 16px;
      letter-spacing: 0;
      transition: background-color 180ms ease, color 180ms ease;
    }

    button,
    textarea,
    input {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      min-height: 44px;
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 6px 24px;
      border-bottom: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      backdrop-filter: saturate(160%) blur(18px);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    .brand strong {
      font-family: var(--reading-font);
      font-size: 21px;
      font-weight: 700;
    }

    .brand span {
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .top-actions,
    .panel-actions,
    .format-actions,
    .mobile-tabs,
    .segmented,
    .variant-switch {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .button,
    .icon-button,
    .segment,
    .variant-button,
    .tab-button {
      border-radius: 7px;
      color: var(--text);
      background: transparent;
      transition: background-color 120ms ease, color 120ms ease, transform 120ms ease;
    }

    .button {
      padding: 8px 14px;
      font-weight: 600;
    }

    .button:hover,
    .icon-button:hover,
    .segment:hover,
    .variant-button:hover,
    .tab-button:hover {
      background: var(--surface-muted);
    }

    .button:active,
    .icon-button:active,
    .segment:active,
    .variant-button:active,
    .tab-button:active {
      transform: translateY(1px);
    }

    .button--primary {
      color: #ffffff;
      background: var(--primary);
    }

    .button--primary:hover {
      background: var(--primary-hover);
    }

    .button--quiet {
      color: var(--muted);
    }

    .icon-button {
      width: 44px;
      padding: 0;
      color: var(--muted);
      font-size: 18px;
    }

    .app {
      width: min(100%, 1480px);
      margin: 0 auto;
      padding: 24px 24px 92px;
    }

    .workspace-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    .workspace-heading h1 {
      margin: 0 0 5px;
      font-family: var(--reading-font);
      font-size: 30px;
      line-height: 1.25;
      font-weight: 700;
    }

    .workspace-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .trust-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--muted);
      background: var(--surface);
      font-size: 13px;
      white-space: nowrap;
    }

    .trust-state::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      content: "";
    }

    .format-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 58px;
      margin-bottom: 12px;
      padding: 7px 9px 7px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .format-controls {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      color: var(--faint);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .segmented {
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-raised);
    }

    .segment,
    .tab-button {
      min-height: 34px;
      padding: 5px 11px;
      color: var(--muted);
      font-size: 13px;
    }

    .segment[aria-pressed="true"],
    .tab-button[aria-selected="true"] {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(20, 24, 32, 0.12);
    }

    .range-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 108px;
      accent-color: var(--primary);
    }

    .mobile-tabs {
      display: none;
      margin-bottom: 10px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-raised);
    }

    .mobile-tabs .tab-button {
      flex: 1;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      height: max(360px, calc(100dvh - 306px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      background: var(--surface);
    }

    .source-panel {
      border-right: 1px solid var(--line);
    }

    .panel-header,
    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      background: var(--surface-raised);
    }

    .panel-header {
      border-bottom: 1px solid var(--line);
    }

    .panel-footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .panel-title {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 0;
    }

    .panel-title strong {
      font-size: 14px;
    }

    .panel-title span {
      color: var(--faint);
      font-size: 12px;
      white-space: nowrap;
    }

    #sourceText {
      width: 100%;
      min-height: 100%;
      resize: none;
      padding: 22px 24px 36px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: var(--surface);
      font-family: var(--ui-font);
      font-size: 16px;
      line-height: 1.75;
      tab-size: 2;
    }

    #sourceText::placeholder {
      color: var(--faint);
    }

    .preview-shell {
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      background: var(--surface);
    }

    #preview {
      width: min(100%, var(--reading-width));
      margin: 0 auto;
      padding: 40px 44px 70px;
      color: var(--text);
      font-family: var(--reading-font);
      font-size: var(--preview-size);
      line-height: 1.92;
      overflow-wrap: anywhere;
    }

    #preview:focus {
      outline: 2px solid color-mix(in srgb, var(--primary) 55%, transparent);
      outline-offset: -12px;
      border-radius: 6px;
    }

    #preview p {
      margin: 0 0 1.45em;
      text-align: justify;
      text-justify: inter-ideograph;
      white-space: pre-line;
    }

    #preview p:last-child {
      margin-bottom: 0;
    }

    .empty-preview {
      display: grid;
      place-items: center;
      min-height: 100%;
      padding: 36px;
      color: var(--faint);
      text-align: center;
    }

    .empty-preview strong {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--reading-font);
      font-size: 21px;
    }

    .integrity {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
    }

    .integrity::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary);
      content: "";
    }

    .integrity[data-state="error"] {
      color: var(--danger);
    }

    .integrity[data-state="error"]::before {
      background: var(--danger);
    }

    .integrity[data-state="edited"] {
      color: var(--accent);
    }

    .integrity[data-state="edited"]::before {
      background: var(--accent);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 76px;
      z-index: 50;
      max-width: min(90vw, 420px);
      padding: 10px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translate(-50%, 10px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .toast[data-open="true"] {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .variant-switch {
      position: fixed;
      left: 50%;
      bottom: 16px;
      z-index: 30;
      padding: 4px;
      border: 1px solid color-mix(in srgb, var(--line) 76%, transparent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      box-shadow: 0 10px 36px rgba(20, 24, 32, 0.18);
      backdrop-filter: saturate(160%) blur(18px);
      transform: translateX(-50%);
    }

    .variant-button {
      min-height: 36px;
      padding: 5px 11px;
      color: var(--muted);
      font-size: 12px;
    }

    .variant-button[aria-pressed="true"] {
      color: #ffffff;
      background: var(--text);
    }

    body[data-variant="studio"] {
      --bg: #e9edf0;
      --surface: #fdfdfc;
      --surface-raised: #f0f3f4;
      --surface-muted: #e1e6e8;
      --text: #172126;
      --muted: #55646b;
      --faint: #77858b;
      --line: #cbd3d6;
      --line-strong: #9dabad;
      --primary: #006b7b;
      --primary-hover: #005765;
      --primary-soft: #dbeef1;
      --accent: #c74b36;
      --reading-font: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body[data-variant="studio"] .workspace {
      box-shadow: 8px 8px 0 color-mix(in srgb, var(--line-strong) 45%, transparent);
    }

    body[data-variant="studio"] #preview {
      line-height: 1.78;
    }

    body[data-variant="focus"] {
      --bg: #151516;
      --surface: #0c0c0d;
      --surface-raised: #171718;
      --surface-muted: #242426;
      --text: #f4f0e8;
      --muted: #b8b2a8;
      --faint: #87827a;
      --line: #333234;
      --line-strong: #555257;
      --primary: #69d2b6;
      --primary-hover: #8be1ca;
      --primary-soft: #173b32;
      --accent: #ff9578;
      --shadow: 0 26px 60px rgba(0, 0, 0, 0.42);
    }

    body[data-variant="focus"] .source-panel {
      opacity: 0.76;
    }

    body[data-variant="focus"] .result-panel {
      background: #0c0c0d;
    }

    body[data-variant="focus"] #preview {
      color: #f4f0e8;
    }

    @media (max-width: 900px) {
      .topbar {
        padding-inline: 16px;
      }

      .top-actions .button--quiet {
        display: none;
      }

      .app {
        padding: 18px 16px 86px;
      }

      .workspace-heading {
        align-items: flex-start;
      }

      .workspace-heading h1 {
        font-size: 27px;
      }

      .format-bar,
      .format-controls {
        align-items: stretch;
      }

      .format-bar {
        flex-direction: column;
        padding: 10px;
      }

      .format-controls {
        justify-content: space-between;
        gap: 10px;
      }

      .range-wrap {
        display: none;
      }

      .format-actions .button {
        flex: 1;
      }

      .mobile-tabs {
        display: flex;
      }

      .workspace {
        display: block;
        height: max(240px, calc(100dvh - 410px));
      }

      .panel {
        height: 100%;
        min-height: 0;
      }

      .source-panel {
        border-right: 0;
      }

      body[data-view="source"] .result-panel,
      body[data-view="result"] .source-panel {
        display: none;
      }

      #sourceText {
        padding: 18px 18px 32px;
      }

      #preview {
        padding: 30px 22px 58px;
      }
    }

    @media (max-width: 520px) {
      .brand span,
      .trust-state {
        display: none;
      }

      .workspace-heading {
        margin-bottom: 14px;
      }

      .workspace-heading p {
        max-width: 25em;
      }

      .control-group {
        width: 100%;
      }

      .control-group .segmented {
        flex: 1;
      }

      .segment {
        flex: 1;
      }

      .panel-actions .button--quiet {
        display: none;
      }

      .variant-switch {
        width: calc(100% - 32px);
      }

      .variant-button {
        flex: 1;
      }
    }

    @media (max-width: 360px) {
      .workspace {
        height: max(210px, calc(100dvh - 444px));
      }
    }

    @media (prefers-contrast: more) {
      :root {
        --line: #737780;
        --line-strong: #3b3e44;
      }

      .button--primary {
        outline: 2px solid currentColor;
        outline-offset: -4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .topbar,
      .variant-switch {
        background: var(--surface);
        backdrop-filter: none;
      }
    }
  </style>
</head>
<body data-variant="paper" data-view="source">
  <header class="topbar">
    <div class="brand">
      <strong>行间</strong>
      <span>长文本排版</span>
    </div>
    <div class="top-actions">
      <input id="fileInput" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
      <button class="button button--quiet" id="fileButton" type="button">导入文本</button>
      <button class="button button--quiet" id="clearButton" type="button">清空</button>
      <button class="icon-button" id="themeButton" type="button" aria-label="切换深色模式" title="切换深色模式">◐</button>
    </div>
  </header>

  <main class="app">
    <div class="workspace-heading">
      <div>
        <h1>把零散分行，整理成自然段落</h1>
        <p>原文保留，只调整空白和换行，不补写标点。</p>
      </div>
      <div class="trust-state">仅在本机处理</div>
    </div>

    <section class="format-bar" aria-label="排版设置">
      <div class="format-controls">
        <div class="control-group">
          <span class="control-label">段落</span>
          <div class="segmented" role="group" aria-label="段落密度">
            <button class="segment" type="button" data-density="compact" aria-pressed="false">紧凑</button>
            <button class="segment" type="button" data-density="balanced" aria-pressed="true">均衡</button>
            <button class="segment" type="button" data-density="airy" aria-pressed="false">舒展</button>
          </div>
        </div>
        <div class="control-group range-wrap">
          <label class="control-label" for="widthRange">行宽</label>
          <input id="widthRange" type="range" min="560" max="860" step="20" value="720">
        </div>
        <div class="control-group range-wrap">
          <label class="control-label" for="fontRange">字号</label>
          <input id="fontRange" type="range" min="16" max="22" step="1" value="18">
        </div>
      </div>
      <div class="format-actions">
        <button class="button button--primary" id="formatButton" type="button">整理段落</button>
      </div>
    </section>

    <div class="mobile-tabs" role="tablist" aria-label="编辑视图">
      <button class="tab-button" id="sourceTab" type="button" role="tab" aria-selected="true">原文</button>
      <button class="tab-button" id="resultTab" type="button" role="tab" aria-selected="false">结果</button>
    </div>

    <section class="workspace" aria-label="长文本排版工作区">
      <section class="panel source-panel" aria-labelledby="sourceTitle">
        <header class="panel-header">
          <div class="panel-title">
            <strong id="sourceTitle">原文</strong>
            <span id="sourceSummary">0 字 · 0 行</span>
          </div>
          <div class="panel-actions">
            <button class="button button--quiet" id="pasteButton" type="button">粘贴</button>
          </div>
        </header>
        <textarea id="sourceText" spellcheck="false" aria-label="原文输入" placeholder="在这里粘贴逐行转写或长文本……"></textarea>
        <footer class="panel-footer">
          <span>Ctrl + Enter 整理</span>
          <span id="lineHint">等待输入</span>
        </footer>
      </section>

      <section class="panel result-panel" aria-labelledby="resultTitle">
        <header class="panel-header">
          <div class="panel-title">
            <strong id="resultTitle">排版结果</strong>
            <span id="resultSummary">0 段</span>
          </div>
          <div class="panel-actions">
            <button class="button button--quiet" id="downloadButton" type="button" disabled>下载</button>
            <button class="button" id="copyButton" type="button" disabled>复制</button>
          </div>
        </header>
        <div class="preview-shell">
          <article id="preview" contenteditable="true" role="textbox" aria-multiline="true" aria-label="可编辑排版结果" spellcheck="false"></article>
          <div class="empty-preview" id="emptyPreview">
            <div><strong>结果会出现在这里</strong><span>粘贴文本后即可整理。</span></div>
          </div>
        </div>
        <footer class="panel-footer">
          <span class="integrity" id="integrityState" data-state="empty">尚未校验</span>
          <span id="outputSummary">0 字</span>
        </footer>
      </section>
    </section>
  </main>

  <div class="variant-switch" role="group" aria-label="原型方案">
    <button class="variant-button" type="button" data-variant-choice="paper" aria-pressed="true">纸张</button>
    <button class="variant-button" type="button" data-variant-choice="studio" aria-pressed="false">工作台</button>
    <button class="variant-button" type="button" data-variant-choice="focus" aria-pressed="false">专注</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const sourceText = document.querySelector("#sourceText");
    const preview = document.querySelector("#preview");
    const emptyPreview = document.querySelector("#emptyPreview");
    const sourceSummary = document.querySelector("#sourceSummary");
    const resultSummary = document.querySelector("#resultSummary");
    const outputSummary = document.querySelector("#outputSummary");
    const integrityState = document.querySelector("#integrityState");
    const lineHint = document.querySelector("#lineHint");
    const copyButton = document.querySelector("#copyButton");
    const downloadButton = document.querySelector("#downloadButton");
    const toast = document.querySelector("#toast");

    const densityConfig = {
      compact: { target: 420, min: 300, max: 520, maxLines: 32 },
      balanced: { target: 260, min: 180, max: 340, maxLines: 20 },
      airy: { target: 160, min: 100, max: 220, maxLines: 12 },
    };

    const transitionStarters = [
      "但是", "不过", "所以", "因此", "同时", "与此同时", "后来", "接下来", "首先", "其次",
      "最后", "换句话说", "问题是", "这就是", "我认为", "事实上", "例如", "比如", "如果", "当",
      "另一方面", "总之", "相反", "于是", "而且", "更重要的是", "回到", "至于",
    ];
    const questionEndings = /(?:吗|呢|什么|为什么|怎么(?:样|办)?|如何|哪里|哪儿|多少|谁|是否|能否|哪个|哪些|什么时候)$/u;
    const fillers = new Set(["嗯", "啊", "哦", "好的", "是的", "对", "没错", "你知道", "你知道的", "然后", "所以"]);
    let density = "balanced";
    let formattedText = "";
    let toastTimer = 0;
    let formatTimer = 0;

    function comparable(value) {
      return value.replace(/[\s\u200B-\u200D\uFEFF]/gu, "");
    }

    function characterCount(value) {
      return Array.from(comparable(value)).length;
    }

    function lineCount(value) {
      if (!value) return 0;
      return value.replace(/\r\n?/g, "\n").split("\n").length;
    }

    function splitLongLine(line, threshold) {
      if (characterCount(line) <= threshold) return [line];
      const parts = line.match(/[^。！？!?；;…]+[。！？!?；;…]*/gu) || [line];
      return parts.filter(Boolean);
    }

    function isTransition(line) {
      return !fillers.has(line) && transitionStarters.some((starter) => line.startsWith(starter));
    }

    function isQuestionLike(line) {
      if (characterCount(line) < 4) return false;
      if (questionEndings.test(line)) return true;
      return /^(你|你们|我们|他|她|它|什么|为什么|如何|怎么|哪里|谁|是否|能否|有没有).*(为什么|如何|怎么|什么|哪|谁|是否|能否)/u.test(line);
    }

    function hasStrongEnding(line) {
      return /[。！？!?；;…][”’」』】）)]?$/u.test(line);
    }

    function joinUnit(left, right) {
      if (!left) return right;
      const spacer = /[A-Za-z0-9]$/u.test(left) && /^[A-Za-z0-9]/u.test(right) ? " " : "";
      return left + spacer + right;
    }

    function buildParagraphs(raw, mode) {
      const config = densityConfig[mode];
      const physicalLines = raw.replace(/\r\n?/g, "\n").split("\n");
      const paragraphs = [];
      let units = [];
      let unitChars = 0;
      let breakBeforeNextUnit = false;

      function flush() {
        if (!units.length) return;
        paragraphs.push(units.map((unit, index) => {
          const prefix = index > 0 && unit.breakBefore ? "\n" : "";
          return prefix + unit.text;
        }).reduce(joinUnit, ""));
        units = [];
        unitChars = 0;
        breakBeforeNextUnit = false;
      }

      for (const physicalLine of physicalLines) {
        const trimmed = physicalLine.trim();
        if (!trimmed) {
          flush();
          continue;
        }

        const pieces = splitLongLine(trimmed, config.max);
        for (const unit of pieces) {
          const nextChars = characterCount(unit);
          const questionLike = isQuestionLike(unit);
          const shouldBreakBefore = units.length > 0 && (
            unitChars >= config.max ||
            units.length >= config.maxLines ||
            (unitChars >= config.min && isTransition(unit))
          );
          if (shouldBreakBefore) flush();

          units.push({
            text: unit,
            breakBefore: units.length > 0 && (breakBeforeNextUnit || questionLike),
          });
          unitChars += nextChars;

          const shouldBreakAfter = unitChars >= config.max ||
            units.length >= config.maxLines ||
            (unitChars >= config.target && hasStrongEnding(unit)) ||
            unitChars >= Math.round(config.target * 1.22);
          if (shouldBreakAfter) {
            flush();
          } else {
            breakBeforeNextUnit = questionLike;
          }
        }
      }

      flush();
      return paragraphs;
    }

    function renderEmpty() {
      formattedText = "";
      preview.replaceChildren();
      emptyPreview.hidden = false;
      resultSummary.textContent = "0 段";
      outputSummary.textContent = "0 字";
      integrityState.textContent = "尚未校验";
      integrityState.dataset.state = "empty";
      copyButton.disabled = true;
      downloadButton.disabled = true;
    }

    function formatText({ switchView = false } = {}) {
      const raw = sourceText.value;
      updateSourceStats();
      if (!raw.trim()) {
        renderEmpty();
        return;
      }

      const paragraphs = buildParagraphs(raw, density);
      formattedText = paragraphs.join("\n\n");
      const intact = comparable(raw) === comparable(formattedText);

      preview.replaceChildren(...paragraphs.map((text) => {
        const paragraph = document.createElement("p");
        paragraph.textContent = text;
        return paragraph;
      }));
      emptyPreview.hidden = true;
      resultSummary.textContent = `${paragraphs.length} 段`;
      outputSummary.textContent = `${characterCount(formattedText).toLocaleString("zh-CN")} 字`;
      integrityState.textContent = intact ? "文字 100% 一致" : "检测到文字变化";
      integrityState.dataset.state = intact ? "valid" : "error";
      copyButton.disabled = !intact;
      downloadButton.disabled = !intact;

      if (switchView && window.matchMedia("(max-width: 900px)").matches) setMobileView("result");
    }

    function syncEditedResult() {
      const edited = preview.innerText.replace(/\r\n?/g, "\n").replace(/\n+$/u, "");
      formattedText = edited;
      const intact = comparable(sourceText.value) === comparable(edited);
      const paragraphCount = edited.trim() ? edited.split(/\n{2,}/u).filter(Boolean).length : 0;
      resultSummary.textContent = `${paragraphCount} 段`;
      outputSummary.textContent = `${characterCount(edited).toLocaleString("zh-CN")} 字`;
      integrityState.textContent = intact ? "文字 100% 一致" : "已人工修改";
      integrityState.dataset.state = intact ? "valid" : "edited";
      copyButton.disabled = !edited.trim();
      downloadButton.disabled = !edited.trim();
    }

    function updateSourceStats() {
      const value = sourceText.value;
      const lines = lineCount(value);
      const chars = characterCount(value);
      sourceSummary.textContent = `${chars.toLocaleString("zh-CN")} 字 · ${lines.toLocaleString("zh-CN")} 行`;
      lineHint.textContent = value ? `平均每行 ${Math.max(1, Math.round(chars / Math.max(1, lines)))} 字` : "等待输入";
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.dataset.open = "true";
      toastTimer = window.setTimeout(() => { toast.dataset.open = "false"; }, 1800);
    }

    async function copyResult() {
      if (!formattedText || copyButton.disabled) return;
      try {
        await navigator.clipboard.writeText(formattedText);
      } catch {
        const fallback = document.createElement("textarea");
        fallback.value = formattedText;
        fallback.style.position = "fixed";
        fallback.style.opacity = "0";
        document.body.append(fallback);
        fallback.select();
        document.execCommand("copy");
        fallback.remove();
      }
      showToast("已复制排版结果");
    }

    function downloadResult() {
      if (!formattedText || downloadButton.disabled) return;
      const blob = new Blob([formattedText], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `排版结果-${new Date().toISOString().slice(0, 10)}.txt`;
      link.click();
      URL.revokeObjectURL(url);
      showToast("文本文件已生成");
    }

    function setMobileView(view) {
      document.body.dataset.view = view;
      document.querySelector("#sourceTab").setAttribute("aria-selected", String(view === "source"));
      document.querySelector("#resultTab").setAttribute("aria-selected", String(view === "result"));
    }

    function setVariant(variant) {
      const allowed = new Set(["paper", "studio", "focus"]);
      const next = allowed.has(variant) ? variant : "paper";
      document.body.dataset.variant = next;
      document.querySelectorAll("[data-variant-choice]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.variantChoice === next));
      });
      const url = new URL(window.location.href);
      url.searchParams.set("variant", next);
      history.replaceState(null, "", url);
      if (next === "focus") document.body.dataset.theme = "dark";
    }

    sourceText.addEventListener("input", () => {
      updateSourceStats();
      window.clearTimeout(formatTimer);
      formatTimer = window.setTimeout(() => formatText(), 220);
    });

    sourceText.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        formatText({ switchView: true });
      }
    });

    document.querySelector("#formatButton").addEventListener("click", () => formatText({ switchView: true }));
    copyButton.addEventListener("click", copyResult);
    downloadButton.addEventListener("click", downloadResult);
    preview.addEventListener("input", syncEditedResult);
    document.querySelector("#clearButton").addEventListener("click", () => {
      sourceText.value = "";
      updateSourceStats();
      renderEmpty();
      setMobileView("source");
      sourceText.focus();
    });

    document.querySelector("#pasteButton").addEventListener("click", async () => {
      try {
        sourceText.value = await navigator.clipboard.readText();
        formatText();
        sourceText.focus();
      } catch {
        sourceText.focus();
        showToast("请在输入框中直接粘贴");
      }
    });

    document.querySelector("#fileButton").addEventListener("click", () => document.querySelector("#fileInput").click());
    document.querySelector("#fileInput").addEventListener("change", async (event) => {
      const [file] = event.target.files;
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) {
        showToast("文本文件不能超过 5MB");
        event.target.value = "";
        return;
      }
      sourceText.value = await file.text();
      formatText({ switchView: true });
      event.target.value = "";
    });

    document.querySelectorAll("[data-density]").forEach((button) => {
      button.addEventListener("click", () => {
        density = button.dataset.density;
        document.querySelectorAll("[data-density]").forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        formatText();
      });
    });

    document.querySelector("#widthRange").addEventListener("input", (event) => {
      document.documentElement.style.setProperty("--reading-width", `${event.target.value}px`);
    });
    document.querySelector("#fontRange").addEventListener("input", (event) => {
      document.documentElement.style.setProperty("--preview-size", `${event.target.value}px`);
    });

    document.querySelector("#themeButton").addEventListener("click", () => {
      const dark = document.body.dataset.theme === "dark";
      document.body.dataset.theme = dark ? "light" : "dark";
      document.querySelector("#themeButton").setAttribute("aria-label", dark ? "切换深色模式" : "切换浅色模式");
    });

    document.querySelector("#sourceTab").addEventListener("click", () => setMobileView("source"));
    document.querySelector("#resultTab").addEventListener("click", () => setMobileView("result"));
    document.querySelectorAll("[data-variant-choice]").forEach((button) => {
      button.addEventListener("click", () => setVariant(button.dataset.variantChoice));
    });

    window.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "c") {
        event.preventDefault();
        void copyResult();
      }
    });

    const preferredDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.body.dataset.theme = preferredDark ? "dark" : "light";
    setVariant(new URLSearchParams(window.location.search).get("variant") || "paper");
    updateSourceStats();
    renderEmpty();
  </script>
</body>
</html>
