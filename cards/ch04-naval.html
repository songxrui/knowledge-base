<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naval 财富等式 · 答案之书</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f5f5f0;font-family:'Georgia','Noto Serif SC',serif}
.card{width:600px;background:#fff;border-radius:16px;padding:48px;box-shadow:0 8px 32px rgba(0,0,0,.08)}
.label{font-size:12px;letter-spacing:2px;color:#999;text-transform:uppercase;margin-bottom:16px}
h1{font-size:28px;font-weight:400;line-height:1.4;margin-bottom:24px;color:#222}
.formula{text-align:center;padding:32px;margin:24px 0;background:#fafaf8;border-radius:12px;font-size:24px;letter-spacing:2px;color:#333}
.formula small{display:block;margin-top:12px;font-size:13px;color:#999}
.lever{display:flex;gap:16px;margin:24px 0}
.lever-item{flex:1;padding:16px;border-radius:8px;text-align:center;font-size:13px}
.l1{background:#f0f7f0;color:#2a6a2a}
.l2{background:#f7f0f0;color:#6a2a2a}
.l3{background:#f0f0f7;color:#2a2a6a}
.lever-item .num{font-size:24px;display:block;margin-bottom:8px}
.lever-item .desc{line-height:1.5}
.quote{border-left:2px solid #ccc;padding-left:20px;margin:24px 0;color:#666;font-style:italic;font-size:14px}
.footer{margin-top:32px;padding-top:16px;border-top:1px solid #eee;font-size:11px;color:#aaa}
</style>
</head>
<body>
<div class="card">
<div class="label">CH04 · 财富商业</div>
<h1>Naval 财富等式</h1>
<div class="quote">"财富不是你赚了多少钱，是你停下来之后还能活多久。"</div>
<div class="formula">财富 = (储蓄率 × 杠杆 × 时间) / 消费欲望<small>杠杆本身不创造价值，它放大你已有的东西</small></div>
<div class="lever">
<div class="lever-item l1"><span class="num">💼</span><strong>劳动力杠杆</strong><div class="desc">让别人为你工作<br>管理成本高</div></div>
<div class="lever-item l2"><span class="num">💰</span><strong>资本杠杆</strong><div class="desc">让钱为你工作<br>需要原始积累</div></div>
<div class="lever-item l3"><span class="num">✍️</span><strong>代码与媒体</strong><div class="desc">让产出自行复制<br>门槛最低</div></div>
</div>
<div class="footer">第三种杠杆——写一个课程、一段代码、一个内容账号——是 2026 年门槛最低的选择</div>
</div>
</body>
</html>
